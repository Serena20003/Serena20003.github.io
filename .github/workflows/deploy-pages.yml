name: Deploy React site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'serena-page/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: serena-page
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: serena-page/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Set deployment commit author
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Build and publish with gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          npm run deploy --
          --repo "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          --message "Deploy ${GITHUB_SHA}"
      # GITHUB_TOKEN pushes do not trigger a second Pages build. Deploy the
      # same build explicitly so publishing never relies on that trigger.
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages build
        uses: actions/upload-pages-artifact@v3
        with:
          path: serena-page/build
      - name: Deploy Pages build
        id: deployment
        uses: actions/deploy-pages@v4
